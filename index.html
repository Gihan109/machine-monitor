<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Web App</title>

    <link rel="stylesheet" href="style.css">
       
</head>
 
<body>
    <hr>
    <h1>MACHINE MONITORING SYSTEM</h1>
    <hr>
<div class="setting-box">
 <h2>OPERATOR SETTINGS</h2>
    <label for="target-speed">Target Motor Speed:</label>
    <input
        type="number"
        id="target-speed"
        value="1500"
        min="500"
        max="2000"
    >
    <span>RPM</span>
        <p id="settings-error" class="input-error"></p>
    <label for="warning-temperature">Warning Temperature:</label>
    <input
        type="number"
        id="warning-temperature"
        value="70"
    >
    <span>°C</span>
    <br><br>

    <label for="high-temperature">High Temperature:</label>
    <input
        type="number"
        id="high-temperature"
        value="80"
    >
    <span>°C</span>

    <br><br>

    <label for="critical-temperature">Critical Temperature:</label>
    <input
        type="number"
        id="critical-temperature"
        value="90"
    >
    <span>°C</span>
</div>
<div class="machine-container">
    <div class="info-box"> 
    <h2>STATUS</h2>
    <p id="machine-status" class="status">STOPPED</p>
    </div>
   <div class="info-box">
    <h2>TEMPERATURE</h2>
    <p id="temperature-value" class="temperature">25 °C</p>
   </div>
   <div class="info-box">
    <h2>MACHINE COUNTER</h2>
    <p id="machine-counter" class="machine-count">0 pcs</p>
   </div>
   <div class="info-box">
    <h2>MACHINE OUTPUT</h2>
    <p id="production-value" class="production">0 pcs</p>  
    </div>
    <div class="info-box"> 
    <h2>MOTOR SPEED</h2>
    <p id="motor-speed" class="motor-speed">0 RPM</p>
    </div>  
    <div class="info-box">
    <h2>ALARM</h2>
    <p id="temperature-alarm" class="alarm-normal">SYSTEM NORMAL</p>
    </div>
    <button id="start-button" >START</button>
    <button id="stop-button" >STOP</button>
</div>
<script src="script.js"></script>
</body> 
</html>
